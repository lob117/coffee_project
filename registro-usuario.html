<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta — Usuario | Paz Magdalena</title>
    <link rel="stylesheet" href="css/coleccion-ltc.css">
    <link rel="stylesheet" href="css/cuenta-ltc.css">
    <script src="js/nav-ltc.js" defer></script>
</head>
<body>
<div id="ltc-nav-global"></div>

<div class="ltc-page-narrow">
    <div class="ltc-auth-box">
        <span class="ltc-badge-tipo">Usuario · Comprador</span>
        <h2>Crear cuenta</h2>
        <p class="ltc-auth-sub">Correo, celular, nacionalidad y contraseña</p>

        <div id="alertBox" class="ltc-alert hidden"></div>

        <form id="formRegistroUsuario">
            <div class="ltc-form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" required placeholder="correo@ejemplo.com" autocomplete="email">
            </div>
            <div class="ltc-form-group">
                <label for="celular">Número de celular</label>
                <input type="tel" id="celular" required placeholder="3001234567" maxlength="10" pattern="[0-9]{10}">
            </div>
            <div class="ltc-form-group">
                <label for="nacionalidad">Nacionalidad</label>
                <select id="nacionalidad" required>
                    <option value="">Selecciona</option>
                    <option>Colombia</option>
                    <option>Estados Unidos</option>
                    <option>México</option>
                    <option>Argentina</option>
                    <option>España</option>
                    <option>Perú</option>
                    <option>Chile</option>
                    <option>Ecuador</option>
                    <option>Brasil</option>
                    <option>Otro</option>
                </select>
            </div>
            <div class="ltc-form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required minlength="6" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
            </div>
            <div class="ltc-form-group">
                <label for="password2">Confirmar contraseña</label>
                <input type="password" id="password2" required minlength="6" placeholder="Repite la contraseña" autocomplete="new-password">
            </div>
            <button type="submit" class="ltc-btn ltc-btn-primary">Crear cuenta</button>
        </form>

        <p class="ltc-divider-text">¿Ya tienes cuenta? <a href="iniciar-sesion.html">Iniciar sesión</a></p>
        <a href="Registrarse.html" class="ltc-btn ltc-btn-outline">Elegir otro tipo de cuenta</a>
    </div>
</div>

<script src="js/cuenta.js"></script>
<script>
PazCuenta.bindForm('formRegistroUsuario', function (e) {
    e.preventDefault();
    PazCuenta.hideAlert('alertBox');
    var email = document.getElementById('email').value.trim();
    var celular = document.getElementById('celular').value.trim();
    var nacionalidad = document.getElementById('nacionalidad').value;
    var password = document.getElementById('password').value;
    var password2 = document.getElementById('password2').value;

    if (!PazCuenta.validarEmail(email)) { PazCuenta.showAlert('alertBox', 'Correo inválido.', 'error'); return; }
    if (!PazCuenta.validarCelular(celular)) { PazCuenta.showAlert('alertBox', 'Celular: 10 dígitos.', 'error'); return; }
    if (!nacionalidad) { PazCuenta.showAlert('alertBox', 'Selecciona nacionalidad.', 'error'); return; }
    if (!PazCuenta.validarPassword(password)) { PazCuenta.showAlert('alertBox', 'Contraseña mínimo 6 caracteres.', 'error'); return; }
    if (password !== password2) { PazCuenta.showAlert('alertBox', 'Las contraseñas no coinciden.', 'error'); return; }

    var res = PazCuenta.registrarUsuario({ email: email, celular: celular, nacionalidad: nacionalidad, password: password });
    if (!res.ok) { PazCuenta.showAlert('alertBox', res.msg, 'error'); return; }

    PazCuenta.showAlert('alertBox', 'Cuenta creada. Redirigiendo…', 'success');
    setTimeout(function () { window.location.href = 'iniciar-sesion.html'; }, 1200);
});
</script>
</body>
</html>
